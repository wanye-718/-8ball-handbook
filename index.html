<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>中式八球速查手册</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0b1e14;color:#c8e6c9;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px;background:#0d2418;border-bottom:1px solid #1a4030;display:flex;align-items:center;gap:10px}
header .logo{width:32px;height:32px;background:#d4af37;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#0b1e14;font-size:14px}
header .title{color:#d4af37;font-size:15px;font-weight:600}
#searchBox{padding:8px 16px;background:#0d2418;border-bottom:1px solid #1a4030}
#searchBox input{width:100%;padding:8px 12px;background:#122e1e;border:1px solid #1a4030;border-radius:6px;color:#c8e6c9;font-size:14px;outline:none}
#searchBox input:focus{border-color:#d4af37}
#main{flex:1;display:flex;overflow:hidden}
#sidebar{width:200px;background:#0d2418;border-right:1px solid #1a4030;overflow-y:auto;flex-shrink:0}
.nav-item{padding:10px 16px;border-bottom:1px solid #0a1a12;color:#a0d0b8;font-size:13px;cursor:pointer;transition:all .2s}
.nav-item:hover,.nav-item.active{background:#173a26;color:#d4af37}
#content{flex:1;overflow-y:auto;padding:20px}
.card{background:#122e1e;border:1px solid #1a4030;border-radius:8px;padding:16px;margin-bottom:12px}
.card h3{color:#d4af37;font-size:15px;margin-bottom:8px}
.card p{font-size:13px;line-height:1.8;color:#a0d0b8}
.badge{display:inline-block;padding:2px 8px;background:rgba(212,175,55,.15);color:#d4af37;border-radius:4px;font-size:11px;margin-right:6px}
@media(max-width:600px){#sidebar{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo">8</div>
  <div class="title">中式八球速查手册</div>
</header>
<div id="searchBox"><input type="text" id="q" placeholder="搜索：加塞/贴球/让点..."></div>
<div id="main">
  <nav id="sidebar"></nav>
  <div id="content"></div>
</div>

<script>
const DATA=[
{cat:"基础",items:[
  {t:"球组配置",k:"球 配置 全色 花色 8号",p:"1颗白球+7颗全色(1-7号)+7颗花色(9-15号)+1颗黑8号，共16颗。球径57.15mm，重156-170g。"},
  {t:"摆球规则",k:"摆球 三角 8号 位置 中心",p:"目标球摆成紧密三角形。8号球在正中心(第三排)。顶角球放在置球点，底边两角分别放一颗全色和一颗花色。"},
  {t:"开球规则",k:"开球 有效 4颗 碰库 进球",p:"母球从开球线后击出。有效条件二选一：①任意目标球入袋 ②至少4颗目标球碰库。不满足则对手可选择接受现状、重摆自己开、或重摆对方开。"},
  {t:"开球8号入袋",k:"开球 8号 入袋 重置",p:"开球时8号入袋：若无犯规，开球方可选8号复位继续或重摆开球；若伴随犯规，对手可选重摆自己开、重摆对方开、8号复位+线后自由球、或接受现状。"},
]},
{cat:"击球与分组",items:[
  {t:"球组确定",k:"分组 全色 花色 定色 开放",p:"开球后球局开放。首个合法入袋的非8号目标球决定你的球组(全色或花色)，对手自动归属另一组。若同时进两种球，可自由选择。"},
  {t:"合法击球",k:"合法 击球 先碰 碰库",p:"每次击球：①母球必须先碰本方目标球 ②击球后至少满足一项：有球入袋/母球碰库/目标球碰库。否则犯规。"},
  {t:"贴球处理",k:"贴球 相贴 移动",p:"母球与目标球相贴时，击球必须使目标球产生明显移动。直接推球属推杆犯规。"},
  {t:"贴库球",k:"贴库 离开 碰库",p:"目标球与库边相贴时，击打后该球须先离开库边再碰库，或有其他球碰库/进袋，否则犯规。"},
]},
{cat:"犯规与处罚",items:[
  {t:"常见犯规",k:"犯规 母球 落袋 未碰 连击",p:"母球未先碰己方球、母球落袋/飞出台面、击球后无球碰库且无球进袋、身体/器材触球、连击、目标球跳出台面。"},
  {t:"处罚标准",k:"犯规 处罚 手中球 自由球",p:"一般犯规→对手获全场自由球(手中球)，可放台面任意位置。开球犯规→对手获线后自由球(只能放开球线后)。"},
  {t:"故意犯规",k:"故意犯规 判负",p:"整场比赛禁止故意犯规。第一次故意犯规判负一局；第二次故意犯规，对手直接赢得本场比赛。"},
  {t:"三次犯规",k:"三次 犯规 判负",p:"同一局比赛中，一名选手连续三次犯规，直接判负该局。"},
]},
{cat:"8号球与胜负",items:[
  {t:"击打8号球条件",k:"8号 击打 清台 报袋",p:"必须己方球组全部清台后，才能击打8号球。击打前必须明确报袋(指定目标袋口)。"},
  {t:"8号胜利条件",k:"8号 胜利 指定袋",p:"己方球清完后，合法将8号球击入指定球袋，且母球未落袋/未飞出台面，即获胜。"},
  {t:"8号即刻判负",k:"8号 判负 提前 落袋 飞出台面 错误袋",p:"以下情况直接判负：①未清完本方球就打进8号 ②打8号时母球落袋/飞出台面 ③8号进非指定袋 ④8号飞出台面。"},
]},
{cat:"技术要点",items:[
  {t:"站位姿势",k:"站位 姿势 三点一线 重心",p:"三点一线法：右脚尖对准击球线，左脚横向岔开约30cm，重心放在右腿。俯身时下巴轻靠球杆，视线沿杆方向。"},
  {t:"加塞(旋转球)",k:"加塞 旋转 让点 左塞 右塞",p:"加塞会使母球产生侧旋，碰库后反射角改变。左塞=向左偏，右塞=向右偏。加塞后需要补让点(瞄准点偏移)。"},
  {t:"高低杆",k:"高杆 低杆 跟杆 拉杆 缩杆",p:"高杆(打上点)=跟进球，母球继续前进。低杆(打下点)=缩回球，母球碰目标球后回退。"},
  {t:"防守球思路",k:"防守 安全球 贴库 贴球",p:"防守目的：让对手难打。方法：①把母球贴库 ②把目标球藏住 ③形成贴球局面。防守时母球碰目标球后必须有球碰库。"},
]}
];

const sidebar=document.getElementById("sidebar");
const content=document.getElementById("content");
const q=document.getElementById("q");
let active="all";

function buildNav(filter){
  filter=filter?filter.toLowerCase():"";
  sidebar.innerHTML="";
  const all=document.createElement("div");
  all.className="nav-item"+(active==="all"?" active":"");
  all.textContent="全部 ("+DATA.reduce((s,c)=>s+c.items.length,0)+")";
  all.onclick=()=>{active="all";buildNav(q.value);render()};
  sidebar.appendChild(all);
  DATA.forEach(cat=>{
    const n=cat.items.filter(i=>!filter||i.t.toLowerCase().includes(filter)||i.k.toLowerCase().includes(filter)||i.p.toLowerCase().includes(filter)).length;
    if(n===0&&!filter)return;
    const el=document.createElement("div");
    el.className="nav-item"+(active===cat.cat?" active":"");
    el.textContent=cat.cat+" ("+n+")";
    el.onclick=()=>{active=cat.cat;buildNav(q.value);render()};
    sidebar.appendChild(el);
  });
}

function render(){
  const filter=q.value.toLowerCase();
  let html="";
  DATA.forEach(cat=>{
    if(active!=="all"&&active!==cat.cat)return;
    cat.items.forEach(item=>{
      if(filter&&!item.t.toLowerCase().includes(filter)&&!item.k.toLowerCase().includes(filter)&&!item.p.toLowerCase().includes(filter))return;
      html+="<div class='card'><h3>"+item.t+"</h3><p>"+item.p+"</p></div>";
    });
  });
  if(!html)html="<div class='card'><p style='color:#888'>未找到匹配内容，换个关键词试试。</p></div>";
  content.innerHTML=html;
}

q.addEventListener("input",()=>{buildNav(q.value);render()});
buildNav();
render();
</script>
</body>
</html>
