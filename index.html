<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中式八球速查手册 · 正确做法版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b1e14;--side:#0d2418;--card:#122e1e;--card-hover:#173a26;--gold:#d4af37;--gold-bg:rgba(212,175,55,.1);--green:#2ecc71;--green-bg:rgba(46,204,113,.08);--red:#e74c3c;--red-bg:rgba(231,76,60,.08);--text:#eaf0ea;--muted:#7a9a86;--border:#1a4a2e;--accent:#1e5a34}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden;font-size:14px;line-height:1.6}
#sidebar{width:250px;min-width:250px;background:linear-gradient(180deg,#0d2418,#091a10);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100}
.side-head{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#bbb);color:#111;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.side-head h1{font-size:14px;color:var(--gold);line-height:1.4}
#search{margin:10px 12px;padding:8px 14px;border-radius:18px;border:1px solid var(--border);background:#0a1a12;color:var(--text);font-size:13px;outline:none;width:calc(100% - 24px)}
#search:focus{border-color:var(--gold)}
#nav{flex:1;overflow-y:auto;padding:6px 0}
.nav-group{padding:6px 14px 4px;font-size:11px;color:var(--muted);letter-spacing:1px}
.nav-item{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;cursor:pointer;font-size:13.5px;color:var(--text);transition:.15s;border-left:3px solid transparent}
.nav-item:hover{background:var(--accent)}
.nav-item.active{background:var(--accent);border-left-color:var(--gold);color:var(--gold)}
.nav-item .cnt{background:var(--border);color:var(--muted);font-size:11px;padding:1px 7px;border-radius:10px}
.side-foot{padding:10px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.7}
#main{flex:1;overflow-y:auto;padding:28px 32px}
#content{max-width:920px;margin:0 auto}
.bread{font-size:12px;color:var(--muted);margin-bottom:10px}
.bread span{color:var(--gold)}
h2.title{font-size:22px;color:var(--gold);margin-bottom:6px}
.desc{color:var(--muted);font-size:14px;margin-bottom:20px;line-height:1.7}
.dia-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.dia{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;flex:1;min-width:240px;text-align:center}
.dia svg{max-width:100%;height:auto}
.dia p{font-size:12px;color:var(--muted);margin-top:8px}
.flow{display:flex;gap:0;margin:18px 0;border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.fstep{flex:1;min-width:130px;background:var(--card);padding:14px 10px;text-align:center}
.fstep+.fstep{border-left:1px solid var(--border)}
.fstep .n{display:inline-block;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#111;font-weight:900;font-size:13px;line-height:26px;margin-bottom:6px}
.fstep h4{font-size:13px;color:var(--gold);margin-bottom:3px}
.fstep p{font-size:12px;color:var(--muted);line-height:1.5}
.mantra{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}
.mitem{flex:1;min-width:190px;background:var(--card);border:1px solid var(--gold);border-radius:10px;padding:13px 15px}
.mitem h4{color:var(--gold);font-size:13.5px;margin-bottom:3px}
.mitem p{font-size:13px;color:var(--muted)}
.scene{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden;transition:.15s}
.scene:hover{border-color:#2a6a42}
.scene-head{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.scene-head h3{font-size:15.5px;color:var(--text);display:flex;align-items:center;gap:8px}
.scene-head .tag{font-size:11px;background:var(--border);color:var(--muted);padding:2px 9px;border-radius:8px;font-weight:400}
.scene-head .arrow{color:var(--muted);font-size:12px;transition:.2s}
.scene.open .arrow{transform:rotate(180deg)}
.scene-body{padding:0 18px 18px;display:none}
.scene.open .scene-body{display:block}
.block{border-radius:10px;padding:14px 16px;margin-bottom:10px}
.block-wrong{background:var(--red-bg);border-left:3px solid var(--red)}
.block-right{background:var(--green-bg);border-left:3px solid var(--green)}
.block-tip{background:var(--gold-bg);border-left:3px solid var(--gold)}
.block-title{font-size:13px;font-weight:700;margin-bottom:8px}
.block-wrong .block-title{color:var(--red)}
.block-right .block-title{color:var(--green)}
.block-tip .block-title{color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g-item{background:rgba(0,0,0,.18);border-radius:8px;padding:9px 11px}
.g-label{font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:2px}
.g-val{font-size:13.5px;line-height:1.6}
.tips-list{list-style:none;padding:0}
.tips-list li{position:relative;padding-left:16px;font-size:13.5px;line-height:1.7;margin-bottom:2px}
.tips-list li::before{content:"\25B8";position:absolute;left:0;color:var(--gold)}
.checklist{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.check{font-size:12px;background:rgba(46,204,113,.12);color:var(--green);padding:3px 10px;border-radius:12px;border:1px solid rgba(46,204,113,.25)}
.koujue{text-align:center;padding:11px;background:rgba(212,175,55,.08);border:1px dashed var(--gold);border-radius:8px;font-size:14.5px;color:var(--gold);font-weight:700;letter-spacing:1px;margin-top:10px}
.vrow{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.vbtn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:20px;font-size:12.5px;text-decoration:none;color:#fff;transition:.15s}
.vbtn.dy{background:linear-gradient(135deg,#222,#444);border:1px solid #666}
.vbtn.bz{background:linear-gradient(135deg,#00a1d6,#0078a8)}
.vbtn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.kw{margin-top:8px;font-size:12px;color:var(--muted)}
.kw code{background:var(--border);padding:2px 8px;border-radius:4px;margin-right:6px;font-family:inherit;color:var(--gold)}
.rtable{width:100%;border-collapse:collapse;font-size:13px;margin:14px 0}
.rtable th{background:var(--accent);color:var(--gold);padding:10px;text-align:left}
.rtable td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.6}
.badge-ok{color:var(--green);font-weight:700}
.stbl{width:100%;border-collapse:collapse;font-size:13px;margin:14px 0}
.stbl th{background:var(--accent);color:var(--gold);padding:10px;text-align:left}
.stbl td{padding:10px;border-bottom:1px solid var(--border);line-height:1.6;vertical-align:top}
.vlib{display:grid;gap:12px}
.vcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:.15s}
.vcard:hover{border-color:var(--gold);background:var(--card-hover)}
.vcard h3{font-size:15px;color:var(--gold);margin-bottom:6px}
.vcard .core{color:var(--muted);font-size:13px;margin-bottom:8px}
.vcard .goto{font-size:12px;color:var(--gold)}
.highlight{box-shadow:0 0 0 2px var(--gold)!important;border-color:var(--gold)!important}
#menuBtn{display:none;position:fixed;top:10px;left:10px;z-index:200;background:var(--gold);color:#111;border:none;border-radius:8px;padding:8px 12px;font-size:16px;cursor:pointer}
@media(max-width:820px){
 #sidebar{position:fixed;left:-270px;top:0;bottom:0;width:270px;transition:.25s;box-shadow:4px 0 24px rgba(0,0,0,.6)}
 #sidebar.open{left:0}
 #menuBtn{display:block}
 #main{padding:56px 14px 20px}
 .grid{grid-template-columns:1fr}
 .fstep{min-width:100%;border-left:1px solid var(--border)!important}
}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>

]
};

const SYM=[

{sym:'出杆最后一下变线',mod:'入位与站位',cause:'没锁点就出杆或手腕参与',fix:'运杆3到5次停住确认瞄准点再送 腕不动靠手臂',verify:'空杆练杆头指同一点'},
{sym:'加塞后母球横移比预期多',mod:'加塞',cause:'让点未补偿或击球点过大',fix:'打左让右打右让左 塞量减一档',verify:'同点打10次记偏差方向'},
{sym:'加塞呲杆',mod:'加塞',cause:'皮头未涂粉或超极限击球点',fix:'涂粉减塞量降力度',verify:'连续10次无异响'},
{sym:'轻推进发力不进',mod:'发力',cause:'发力进球点改变仍用轻推瞄准位',fix:'发力先判轨迹再调瞄准点 轻推往薄推',verify:'同球轻推发力各10次对比'},
{sym:'长台一发力求就偏',mod:'长台',cause:'只盯袋口旋转累积偏差',fix:'看整体路径先定方向再微调 中杆偏下',verify:'长台10颗进7'},
{sym:'母球不是多就是少',mod:'走位',cause:'没有力度分级基准',fix:'建三分五分七分力距离表',verify:'落点误差不超半颗球'},
{sym:'打着打着没球可打',mod:'清台',cause:'未倒推球堆未K',fix:'开杆前倒推全程 顺带K球',verify:'清台率提升'},

const VIDS=[
{id:1,title:'调整脚尖 解决五分点打不进的问题',core:'视线与站位不匹配 身体扭转致瞄准误差',kw:'台球 站位 脚尖 进球线 五分点'},
{id:2,title:'斯诺克架杆使用教学',core:'锁定固定动作 手腕不动 球杆拉满 瞄准点固定',kw:'斯诺克架杆 机械桥 使用教学'},
{id:3,title:'发力与不发力的进球点差异',core:'发力进球点会变 不能沿用轻推瞄准位',kw:'台球 发力 进球点 差异 轻推'},
{id:4,title:'长台发力的进球点判断',core:'不盯袋口 关注整体路径 先定方向再微调',kw:'台球 长台 发力 进球点 判断'},
{id:5,title:'出杆动作完整性训练',core:'拉满出杆连贯 中途不停顿不减速',kw:'台球 出杆 动作 完整性 训练 拉满'}
];

let active='home';
const navEl=document.getElementById('nav'),ct=document.getElementById('content'),sq=document.getElementById('search');

function buildNav(q){
 const f=(q||'').toLowerCase();let h='';
 h+='<div class="nav-item'+(active==='home'?' active':'')+'" onclick="go(\'home\')">首页·出杆前总纲</div>';
 h+='<div class="nav-item'+(active==='right'?' active':'')+'" onclick="go(\'right\')">正确做法速览</div>';
 h+='<div class="nav-item'+(active==='videos'?' active':'')+'" onclick="go(\'videos\')">教学视频要点库</div>';
 h+='<div class="nav-item'+(active==='symp'?' active':'')+'" onclick="go(\'symp\')">症状索引</div>';
 const groups={};TAGS.forEach(t=>{(groups[t.g]=groups[t.g]||[]).push(t)});
 for(const g in groups){
  const items=groups[g].filter(t=>!f||matchTag(t,f));
  if(!items.length)continue;
  h+='<div class="nav-group">'+g+'</div>';
  items.forEach(t=>{h+='<div class="nav-item'+(active===t.id?' active':'')+'" onclick="go(\''+t.id+'\')">'+t.n+'<span class="cnt">'+S[t.id].length+'</span></div>'});
 }
 navEl.innerHTML=h;
}
function matchTag(t,f){
 if(t.n.toLowerCase().indexOf(f)>-1)return true;
 return S[t.id].some(s=>(s.t+s.tag+s.koujue+s.wrong).toLowerCase().indexOf(f)>-1);
}
function go(id){active=id;document.getElementById('sidebar').classList.remove('open');buildNav(sq.value);render(id);document.getElementById('main').scrollTop=0;}

function render(id){
 if(id==='home')return rHome();
 if(id==='right')return rRight();
 if(id==='videos')return rVids();
 if(id==='symp')return rSymp();
 rTag(id);
}

function rHome(){
 const steps=['读台定球','定落点倒推','分离角塞量决策','入位五步','出杆前3秒自检'];
 const sub=['看清哪颗能打哪个袋','先想母球停哪再想怎么打','中高还是低顺反还是无塞','踩线跨步俯身架桥贴杆','锁点呼吸送杆随挥'];
 let flow='';for(let i=0;i<5;i++){flow+='<div class="fstep"><span class="n">'+(i+1)+'</span><h4>'+steps[i]+'</h4><p>'+sub[i]+'</p></div>';}
 ct.innerHTML='<div class="bread">首页</div><h2 class="title">出杆前固化流程·总纲</h2>'
 +'<p class="desc">每一杆之前按顺序走完这五步 走完再出杆 没走完不出杆。</p><div class="flow">'+flow+'</div>'
 +'<div class="mantra"><div class="mitem"><h4>顺薄反厚 高顺低反</h4><p>顺塞吃库角变大 反塞变小 高顺最大 低反最小</p></div>'
 +'<div class="mitem"><h4>打左让右 打右让左</h4><p>加塞必有让点 塞越大距离越长让点越多</p></div>'
 +'<div class="mitem"><h4>先定落点 再选杆法</h4><p>永远先想母球停哪 再决定杆法和力度</p></div></div>'
 +'<div class="dia-row"><div class="dia">'+DIA.stroke+'</div><div class="dia">'+DIA.sep+'</div></div>'
 +'<p class="desc" style="margin-top:14px">左侧选正确做法速览看全部模块总表 选症状索引按现象查原因</p>';
}

function rRight(){
 let h='<div class="bread">正确做法速览</div><h2 class="title">正确做法速览 全模块总表</h2><p class="desc">把十个模块的正确做法集中在此 练球前花3分钟过一遍 点模块名跳转详细场景</p>';
 TAGS.forEach(t=>{
  h+='<h3 style="color:var(--gold);margin:18px 0 8px;font-size:16px;cursor:pointer" onclick="go(\''+t.id+'\')">'+t.n+' 跳转</h3>';
  h+='<table class="rtable"><thead><tr><th style="width:28%">场景</th><th style="width:36%">正确做法</th><th style="width:36%">实用技巧</th></tr></thead><tbody>';
  S[t.id].forEach(s=>{
   const right=Object.entries(s.right).map(kv=>kv[1]&&kv[1]!=='无'?'<b>'+kv[0]+' '+kv[1]+'</b>':'').filter(Boolean).join('　');
   h+='<tr><td>'+s.t+'</td><td class="badge-ok">'+right+'</td><td>'+s.tips.slice(0,2).join('；')+'</td></tr>';
  });
  h+='</tbody></table>';
 });
 ct.innerHTML=h;
}

function rTag(id){
 const tag=TAGS.find(t=>t.id===id);if(!tag)return;
 const list=S[id],dk={shape:'sep',cueball:'bank',method:'cue',power:'stroke',walk:'sep',pos:'stroke',equip:'aim',clear:'run',safe:'bank',hard:'aim'}[id]||'aim';
 ct.innerHTML='<div class="bread"><span>'+tag.g+'</span> / '+tag.n+'</div><h2 class="title">'+tag.n+'</h2><p class="desc">共 '+list.length+' 个子场景 每张卡片按 常见错误到正确做法到实用技巧 排列 点击标题展开</p><div class="dia-row"><div class="dia">'+DIA[dk]+'</div></div>'+list.map(card).join('');
 const first=document.querySelector('.scene');if(first)first.classList.add('open');
}

function card(s){
 const v=s.vid?VIDS.find(x=>x.id===s.vid):null;
 const kw='中式八球 '+s.tag+' '+s.t;
 const rights=Object.entries(s.right).map(kv=>kv[1]&&kv[1]!=='无'?'<div class="g-item"><div class="g-label">'+kv[0]+'</div><div class="g-val">'+kv[1]+'</div></div>':'').join('');
 const keystr=(s.t+s.tag+s.wrong+s.koujue+s.tips.join(' ')).toLowerCase();
 return '<div class="scene" data-k="'+keystr+'"><div class="scene-head" onclick="this.parentElement.classList.toggle(\'open\')"><h3>'+s.t+' <span class="tag">'+s.tag+'</span></h3><span class="arrow">&#9660;</span></div><div class="scene-body">'
 +'<div class="block block-wrong"><div class="block-title">常见错误</div><div class="g-val">'+s.wrong+'</div></div>'
 +'<div class="block block-right"><div class="block-title">正确做法</div><div class="grid">'+rights+'</div></div>'
 +'<div class="block block-tip"><div class="block-title">实用技巧</div><ul class="tips-list">'+s.tips.map(t=>'<li>'+t+'</li>').join('')+(v?'<li style="color:var(--gold);margin-top:4px">对应教学 '+v.title+'</li>':'')+'</ul><div class="checklist">'+s.check.map(c=>'<span class="check">已核对 '+c+'</span>').join('')+'</div></div>'
 +'<div class="koujue">'+s.koujue+'</div>'
 +'<div class="vrow"><a class="vbtn dy" href="https://www.douyin.com/search/'+encodeURIComponent(kw)+'" target="_blank">抖音搜</a><a class="vbtn bz" href="https://search.bilibili.com/all?keyword='+encodeURIComponent(kw)+'" target="_blank">B站搜</a></div>'
 +'<div class="kw">检索词 <code>'+kw+'</code></div></div></div>';
}

function rVids(){
 let h='<div class="bread"><span>教学视频要点库</span></div><h2 class="title">教学视频要点库</h2><p class="desc">5条核心教学已拆解进对应场景的实用技巧 此处集中速览 点卡片跳转对应标签</p><div class="vlib">';
 VIDS.forEach(v=>{
  const tag=(v.id===1||v.id===2||v.id===5)?'pos':(v.id===3?'power':'hard');
  const tagname=(v.id===1||v.id===2||v.id===5)?'入位五步':(v.id===3?'发力与让点':'难度球技巧');
  h+='<div class="vcard" onclick="go(\''+tag+'\')"><h3>视频'+v.id+' '+v.title+'</h3><div class="core">核心 '+v.core+'</div><div class="vrow"><a class="vbtn dy" href="https://www.douyin.com/search/'+encodeURIComponent(v.kw)+'" target="_blank" onclick="event.stopPropagation()">抖音</a><a class="vbtn bz" href="https://search.bilibili.com/all?keyword='+encodeURIComponent(v.kw)+'" target="_blank" onclick="event.stopPropagation()">B站</a></div><div class="goto">已嵌入标签 '+tagname+'</div></div>';
 });
 h+='</div>';
 ct.innerHTML=h;
}

function rSymp(){
 let h='<div class="bread"><span>症状索引</span></div><h2 class="title">症状索引 急诊表</h2><p class="desc">先判断是决策错还是执行错 再对症修正</p><table class="stbl"><thead><tr><th>出现现象</th><th>模块</th><th>根本原因</th><th>修正动作</th><th>验证方法</th></tr></thead><tbody>';
 SYM.forEach(s=>{h+='<tr><td>'+s.sym+'</td><td>'+s.mod+'</td><td>'+s.cause+'</td><td class="badge-ok">'+s.fix+'</td><td>'+s.verify+'</td></tr>';});
 h+='</tbody></table><div class="mantra"><div class="mitem"><h4>决策错</h4><p>瞄错分离角算错顺序选错 查清台倒推分离角难度球</p></div><div class="mitem"><h4>执行错</h4><p>入位歪出杆飘让点没补 查入位五步加塞让点发力</p></div></div>';
 ct.innerHTML=h;
}

function hl(){const q=sq.value.toLowerCase();document.querySelectorAll('.scene,.vcard').forEach(el=>{el.classList.toggle('highlight',!!q&&(el.dataset.k||'').toLowerCase().indexOf(q)>-1)})}
sq.addEventListener('input',()=>{buildNav(sq.value);if(active!=='home')render(active);hl()});
sq.addEventListener('keydown',e=>{if(e.key==='Enter')hl()});

buildNav('');render('home');
</script>
